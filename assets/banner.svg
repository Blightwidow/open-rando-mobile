<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">TrainRando</title>
  <desc id="desc">Offline hiking between train stations on French GR, GRP and PR trails</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1f17"/>
      <stop offset="0.6" stop-color="#1b4332"/>
      <stop offset="1" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd29f"/>
      <stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="train" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2593a"/>
      <stop offset="1" stop-color="#8f3a22"/>
    </linearGradient>
    <linearGradient id="title-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b7e4c7"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#d8f3dc" opacity="0.55">
      <circle cx="90" cy="48" r="1.6"/><circle cx="210" cy="92" r="1.2"/><circle cx="330" cy="36" r="1.4"/>
      <circle cx="470" cy="70" r="1"/><circle cx="560" cy="28" r="1.5"/><circle cx="700" cy="60" r="1.1"/>
      <circle cx="800" cy="30" r="1.3"/><circle cx="930" cy="84" r="1.5"/><circle cx="1050" cy="40" r="1.2"/>
      <circle cx="1170" cy="76" r="1.6"/><circle cx="1230" cy="30" r="1"/>
    </g>

    <!-- sun -->
    <circle cx="1130" cy="112" r="42" fill="url(#sun)" opacity="0.85"/>

    <!-- far mountains -->
    <path d="M520 330 L700 150 L770 215 L850 120 L1010 290 L1130 200 L1280 320 L1280 420 L520 420 Z" fill="#40916c" opacity="0.4"/>

    <!-- near mountains -->
    <path d="M380 340 L560 190 L640 262 L760 150 L960 340 L1280 340 L1280 420 L380 420 Z" fill="#2d6a4f"/>
    <path d="M760 150 L728 188 L752 182 L766 202 L782 180 L802 194 Z" fill="#d8f3dc"/>

    <!-- foreground hills -->
    <path d="M0 350 Q180 300 360 345 T720 350 T1080 340 T1280 352 L1280 420 L0 420 Z" fill="#1b4332"/>

    <!-- trail: dashed GPX line climbing to the summit -->
    <path d="M520 352 C 560 330, 600 300, 650 278 S 720 250, 700 222 S 750 190, 760 156"
          fill="none" stroke="#e72323" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
    <circle cx="520" cy="352" r="7" fill="#16a34a" stroke="#fff" stroke-width="2.5"/>
    <circle cx="760" cy="154" r="7" fill="#dc2626" stroke="#fff" stroke-width="2.5"/>

    <!-- rails -->
    <rect x="0" y="372" width="1280" height="3" fill="#74c69d" opacity="0.6"/>
    <g fill="#74c69d" opacity="0.35">
      <rect x="20" y="378" width="14" height="4"/><rect x="80" y="378" width="14" height="4"/>
      <rect x="140" y="378" width="14" height="4"/><rect x="200" y="378" width="14" height="4"/>
      <rect x="260" y="378" width="14" height="4"/><rect x="320" y="378" width="14" height="4"/>
      <rect x="380" y="378" width="14" height="4"/><rect x="440" y="378" width="14" height="4"/>
      <rect x="500" y="378" width="14" height="4"/><rect x="560" y="378" width="14" height="4"/>
      <rect x="620" y="378" width="14" height="4"/><rect x="680" y="378" width="14" height="4"/>
      <rect x="740" y="378" width="14" height="4"/><rect x="800" y="378" width="14" height="4"/>
      <rect x="860" y="378" width="14" height="4"/><rect x="920" y="378" width="14" height="4"/>
      <rect x="980" y="378" width="14" height="4"/><rect x="1040" y="378" width="14" height="4"/>
      <rect x="1100" y="378" width="14" height="4"/><rect x="1160" y="378" width="14" height="4"/>
      <rect x="1220" y="378" width="14" height="4"/>
    </g>

    <!-- train -->
    <g>
      <path d="M560 372 L560 340 Q560 326 590 322 L690 318 Q740 316 762 350 L772 366 Q774 372 766 372 Z" fill="url(#train)"/>
      <path d="M700 322 L742 322 Q752 334 758 346 L704 346 Z" fill="#1b4332" opacity="0.85"/>
      <g fill="#fcd29f" opacity="0.9">
        <rect x="590" y="334" width="16" height="10" rx="2"/><rect x="616" y="334" width="16" height="10" rx="2"/>
        <rect x="642" y="334" width="16" height="10" rx="2"/><rect x="668" y="334" width="16" height="10" rx="2"/>
      </g>
      <rect x="560" y="358" width="212" height="3" fill="#fcd29f" opacity="0.5"/>
      <rect x="788" y="326" width="200" height="46" rx="6" fill="url(#train)"/>
      <rect x="1008" y="326" width="200" height="46" rx="6" fill="url(#train)"/>
      <g fill="#fcd29f" opacity="0.9">
        <rect x="806" y="338" width="16" height="10" rx="2"/><rect x="832" y="338" width="16" height="10" rx="2"/>
        <rect x="858" y="338" width="16" height="10" rx="2"/><rect x="884" y="338" width="16" height="10" rx="2"/>
        <rect x="910" y="338" width="16" height="10" rx="2"/><rect x="936" y="338" width="16" height="10" rx="2"/>
        <rect x="1026" y="338" width="16" height="10" rx="2"/><rect x="1052" y="338" width="16" height="10" rx="2"/>
        <rect x="1078" y="338" width="16" height="10" rx="2"/><rect x="1104" y="338" width="16" height="10" rx="2"/>
        <rect x="1130" y="338" width="16" height="10" rx="2"/><rect x="1156" y="338" width="16" height="10" rx="2"/>
      </g>
      <rect x="772" y="352" width="16" height="4" fill="#5c2615"/>
      <rect x="988" y="352" width="20" height="4" fill="#5c2615"/>
    </g>

    <!-- text -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="136" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#title-fill)">TrainRando</text>
      <text x="74" y="186" font-size="26" font-weight="500" fill="#d8f3dc">Hike from station to station.</text>
      <text x="74" y="222" font-size="26" font-weight="500" fill="#95d5b2">Fully offline.</text>

      <g font-size="15" font-weight="600" fill="#d8f3dc">
        <rect x="74" y="266" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#74c69d" stroke-opacity="0.6"/>
        <text x="126" y="287" text-anchor="middle">GR · GRP · PR</text>
        <rect x="190" y="266" width="104" height="32" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#74c69d" stroke-opacity="0.6"/>
        <text x="242" y="287" text-anchor="middle">Offline maps</text>
        <rect x="306" y="266" width="110" height="32" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#74c69d" stroke-opacity="0.6"/>
        <text x="361" y="287" text-anchor="middle">No tracking</text>
      </g>
    </g>
  </g>
</svg>
