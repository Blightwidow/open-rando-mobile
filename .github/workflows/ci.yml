name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun run test

  # APK is built for PRs (test download) and for published releases (attached to the release),
  # never on plain pushes to main
  build-android:
    name: Build Android APK
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild Android
        run: bunx expo prebuild --platform android

      - name: Build APK
        run: cd android && ./gradlew assembleRelease
        env:
          # Inlined into the JS bundle; shown in the debug log at startup
          EXPO_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attach APK to release
        if: github.event_name == 'release'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "trainrando-${RELEASE_TAG}.apk"
          gh release upload "$RELEASE_TAG" "trainrando-${RELEASE_TAG}.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Upload APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trainrando-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Post APK download QR code on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts`;
            const artifactUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(artifactUrl)}`;
            const shortSha = headSha.substring(0, 7);
            const artifactName = `trainrando-apk-${headSha}`;

            const body = [
              `### 📱 Test APK ready`,
              ``,
              `![QR Code](${qrUrl})`,
              ``,
              `**[Download APK](${artifactUrl})** — scroll to Artifacts section`,
              ``,
              `> Artifact: \`${artifactName}\``,
              `> Commit: \`${shortSha}\``,
            ].join('\n');

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '### 📱 Test APK ready';
            const existing = comments.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
